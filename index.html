<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16514e">
<title>Ready72h</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#1c2b33; --ink-soft:#5b7178; --paper:#faf7f0; --card:#ffffff;
  --accent:#c9702c; --accent-dark:#9c4f1a; --teal:#1f6f6b; --teal-dark:#16514e;
  --line:#e3dccb; --danger-soft:#f4e3d3; --ok:#2f8f6c;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
img{max-width:100%;}
[hidden]{display:none!important;}

header.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(120deg,var(--teal-dark),var(--teal));
  color:#fdf8ef;
  padding: calc(10px + var(--safe-top)) 16px 10px;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:720px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; letter-spacing:-0.01em;}
.brand .num{background:var(--accent); color:#fff; border-radius:8px; padding:1px 6px; font-size:13px;}
.controls{display:flex; gap:6px;}
select.lang-select{
  background:rgba(255,255,255,0.14); color:#fff; border:1px solid rgba(255,255,255,0.4);
  border-radius:8px; padding:6px 8px; font-size:13px; font-weight:600;
}
.tagline{max-width:720px; margin:6px auto 0; font-size:12.5px; color:#eadfca;}

.variant-toggle{
  display:flex; gap:0; max-width:720px; margin:10px auto 0; background:rgba(255,255,255,0.12);
  border-radius:10px; padding:3px; border:1px solid rgba(255,255,255,0.3);
}
.variant-toggle button{
  flex:1; border:none; background:transparent; color:#fdf8ef; padding:8px 6px; font-size:12.5px;
  font-weight:700; border-radius:8px; cursor:pointer;
}
.variant-toggle button.active{background:#fdf8ef; color:var(--teal-dark);}

main{max-width:720px; margin:0 auto; padding:16px 14px calc(90px + var(--safe-bottom));}

.progress-card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; margin-bottom:16px; display:flex; align-items:center; gap:12px;
}
.progress-ring{width:42px;height:42px;flex:none;}
.progress-text{font-size:13px; color:var(--ink-soft);}
.progress-text b{color:var(--ink); font-size:15px;}

.intro-block{margin-bottom:18px;}
.intro-block h1{font-size:20px; margin:0 0 6px; font-family:Georgia,serif;}
.intro-block p{font-size:13.5px; color:var(--ink-soft); margin:0 0 8px; line-height:1.5;}

section.group{margin-bottom:20px;}
h2.group-title{
  font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent-dark);
  font-weight:800; margin:0 0 8px;
}

.cat-card{
  background:var(--card); border:1px solid var(--line); border-left:4px solid var(--teal);
  border-radius:10px; padding:12px 14px; margin-bottom:10px;
}
.cat-card.alt{border-left-color:var(--accent);}
.cat-card h3{font-size:15px; margin:0 0 3px; font-family:Georgia,serif;}
.cat-card .note{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin:0 0 8px;}
ul.check-list{list-style:none; margin:0; padding:0;}
ul.check-list li{
  display:flex; align-items:flex-start; gap:9px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px;
}
ul.check-list li:first-child{border-top:none;}
ul.check-list li input[type=checkbox]{
  appearance:none; -webkit-appearance:none; width:19px; height:19px; flex:none; margin-top:1px;
  border:1.6px solid #9fb0ab; border-radius:5px; cursor:pointer; position:relative; background:#fff;
}
ul.check-list li input[type=checkbox]:checked{background:var(--ok); border-color:var(--ok);}
ul.check-list li input[type=checkbox]:checked::after{
  content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
  border:solid white; border-width:0 2px 2px 0; transform:rotate(40deg);
}
ul.check-list li label{cursor:pointer; line-height:1.42;}
ul.check-list li.done label{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

.plan-card{background:#f1ece1; border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.plan-card h3{font-size:14px; margin:0 0 5px; color:var(--teal-dark); font-family:Georgia,serif;}
.plan-card ul{margin:0; padding-left:18px;}
.plan-card li{font-size:13px; margin-bottom:3px;}

.variant-hero{background:var(--teal-dark); color:#fdf8ef; border-radius:10px; padding:14px 16px; margin-bottom:14px;}
.variant-hero h2{font-size:17px; margin:0 0 5px;}
.variant-hero p{margin:0; font-size:12.5px; color:#eadfca;}
.adapt-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px;}
.adapt-card h3{font-size:13.5px; margin:0 0 3px; font-family:Georgia,serif; display:flex; gap:7px; align-items:center;}
.adapt-card h3 .num{background:var(--accent); color:#fff; width:19px;height:19px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.adapt-card p{font-size:12.8px; color:var(--ink-soft); margin:0 0 0 26px;}

.sources-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--ink-soft);}
.sources-card li{margin-bottom:6px;}
.disclaimer{margin-top:10px; background:var(--danger-soft); color:var(--accent-dark); border-radius:8px; padding:9px 11px; font-size:11.8px;}

.reset-row{text-align:center; margin-top:18px;}
.reset-row button{
  background:none; border:1px solid var(--line); color:var(--ink-soft); border-radius:20px;
  padding:8px 16px; font-size:12.5px; cursor:pointer;
}

nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:#fff; border-top:1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-bottom));
  display:flex; justify-content:space-around;
}
nav.tabbar button{
  background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 6px; cursor:pointer; flex:1;
}
nav.tabbar button .dot{width:20px;height:20px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;}
nav.tabbar button.active{color:var(--teal-dark);}
nav.tabbar button.active .dot{background:var(--teal-dark); color:#fff;}

.offline-banner{
  display:none; background:var(--accent); color:#fff; text-align:center; font-size:12px; padding:6px;
}
.offline-banner.show{display:block;}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f1ece4; --ink-soft:#b9c4c2; --paper:#10181a; --card:#182325;
    --line:#2b3a3c; --danger-soft:#3a2a1c;
  }
  :root:not([data-theme="light"]) nav.tabbar{background:#131c1e;}
  :root:not([data-theme="light"]) ul.check-list li input[type=checkbox]{background:#0f1719;}
}
:root[data-theme="dark"]{
  --ink:#f1ece4; --ink-soft:#b9c4c2; --paper:#10181a; --card:#182325;
  --line:#2b3a3c; --danger-soft:#3a2a1c;
}
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">⚡ Tryb offline — treść działa bez internetu</div>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand"><span>Ready72h</span></div>
    <div class="controls">
      <select class="lang-select" id="langSelect">
        <option value="pl">PL</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="es">ES</option>
      </select>
    </div>
  </div>
  <div class="tagline" id="tagline"></div>
  <div class="variant-toggle" id="variantToggle">
    <button data-variant="apartment" id="btnApartment"></button>
    <button data-variant="house" id="btnHouse"></button>
  </div>
</header>

<main id="app">
  <div class="progress-card">
    <svg class="progress-ring" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="18" fill="none" stroke="#e3dccb" stroke-width="5"/>
      <circle id="progressCircle" cx="21" cy="21" r="18" fill="none" stroke="#2f8f6c" stroke-width="5"
        stroke-dasharray="113" stroke-dashoffset="113" stroke-linecap="round" transform="rotate(-90 21 21)"/>
    </svg>
    <div class="progress-text"><b id="progressPct">0%</b> <span id="progressLabel"></span></div>
  </div>

  <div id="view-checklist">
    <div class="intro-block">
      <h1 id="introHeading"></h1>
      <p id="introPara0"></p>
    </div>
    <section class="group" id="groupSupplies">
      <h2 class="group-title" id="suppliesHeading"></h2>
      <div id="suppliesCards"></div>
    </section>
  </div>

  <div id="view-family" hidden>
    <section class="group">
      <h2 class="group-title" id="familyHeading"></h2>
      <p class="intro-block" id="familyIntro" style="font-size:13.5px;color:var(--ink-soft);"></p>
      <div id="familyCards"></div>
    </section>
  </div>

  <div id="view-bag" hidden>
    <section class="group">
      <h2 class="group-title" id="bagHeading"></h2>
      <p class="intro-block" id="bagIntro" style="font-size:13.5px;color:var(--ink-soft);"></p>
      <div id="bagCards"></div>
    </section>
  </div>

  <div id="view-variant" hidden>
    <div class="variant-hero">
      <h2 id="variantHeading"></h2>
      <p id="variantIntro"></p>
    </div>
    <div id="variantCards"></div>
  </div>

  <div id="view-sources" hidden>
    <section class="group">
      <h2 class="group-title" id="sourcesHeading"></h2>
      <ul class="sources-card" id="sourcesList" style="list-style:none;padding:12px 14px;"></ul>
      <div class="disclaimer" id="sourcesDisclaimer"></div>
    </section>
  </div>

  <div class="reset-row">
    <button id="resetBtn">↺ <span id="resetLabel"></span></button>
  </div>
</main>

<nav class="tabbar">
  <button class="active" data-view="checklist"><span class="dot">72</span><span id="tabChecklist"></span></button>
  <button data-view="family"><span class="dot">☎</span><span id="tabFamily"></span></button>
  <button data-view="bag"><span class="dot">🎒</span><span id="tabBag"></span></button>
  <button data-view="variant"><span class="dot">🏠</span><span id="tabVariant"></span></button>
  <button data-view="sources"><span class="dot">i</span><span id="tabSources"></span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
